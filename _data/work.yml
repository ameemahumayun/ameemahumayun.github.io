# ============================================================
# WORK PROJECTS — data source for /portfolio/
# Each entry renders one .work-card on the Work page, in order.
# To add/reorder/edit a project: edit THIS file, not portfolio/index.html.
#
# Fields per entry:
#   meta        (required) the small label line above the title
#   title       (required) project name
#   desc        (required) one-paragraph description
#   type        (required) "publication" or "design" — powers the
#               All / Publications / Design filter on /portfolio/.
#
#   Then EITHER a list of links OR a status string (not both):
#
#   links:      list of buttons. Each link has:
#               - label   (required) text shown
#                 url     (for real links) destination. Use a site path like
#                         "/portfolio/safarnama/" for internal pages (passed
#                         through relative_url), or a full https:// URL.
#                 external  (optional) true -> opens in new tab w/ rel=noopener
#                 muted     (optional) true -> adds work-card__link--muted
#                 primary   (optional) true -> adds work-card__link--primary
#                           (accent-outlined, fills solid on hover). Use for
#                           the lead CTA, e.g. "View Publication".
#                 suffix    (optional) faint appended text, e.g. "· soon"
#                 pending   (optional) true -> renders an INERT button (a <span>,
#                           not a link): same pill look, but goes nowhere and is
#                           not clickable. Use for "View Case Study · soon". When
#                           pending is true, `url`/`external`/`primary` are ignored.
#
#   status:     a plain string -> renders one .work-card__status span instead
#               of any link buttons. Use for projects with nothing to link yet.
#
#   archived:   (optional) true -> a plain "Archives" label is inserted in
#               the Design list right before the first entry with this set.
#               Keep archived entries grouped together at the end of the
#               design-type block so the divider only appears once.
# ============================================================

- meta: "ACM CHI 2026 · Health AI · Qualitative UX + LLM Evaluation"
  title: "Beyond Euphemisms"
  type: publication
  desc: "How do LLMs handle the indirect, euphemistic language women in Pakistan use to talk about sexual and reproductive health? Through 40 clinician–patient observations, 22 interviews and 5 focus groups, we built a Domain–Approach framework for indirect health language, then evaluated 5 LLMs on 71 culturally grounded Roman Urdu utterances with gynecologist validation. Models that scored well overall still failed in clinically consequential ways that aggregate metrics hide. As first author and project lead, I designed and ran the fieldwork, developed the framework, co-designed the evaluation, and presented the work live at CHI 2026. Supported by the Gates Foundation and the Patrick J. McGovern Foundation."
  links:
    - label: "View Publication"
      url: "https://doi.org/10.1145/3772318.3791315"
      external: true
      primary: true

- meta: "USENIX SOUPS 2026 · Privacy &amp; Security · Qualitative UX"
  title: "Sharing Digital Devices Is Normal and Cultural"
  type: publication
  desc: "How do privacy and security work when digital devices are routinely shared within families? With the University of Waterloo, we interviewed 41 people across 18 South Asian immigrant families, including parent–child pairs, and found that device sharing is a culturally governed practice, shaped by family authority, trust and social norms, that creates privacy risks today's designs don't anticipate. As second author, I was one of two primary qualitative coders (about half the interviews), co-developed the codebook, helped frame the findings, and substantially drafted the findings and discussion, which turn participants' needs into design recommendations for multi-user access and privacy controls."
  links:
    - label: "View Publication"
      url: "https://www.usenix.org/conference/soups2026/presentation/shanza"
      external: true
      primary: true

- meta: "Nature Health · Health AI · Qualitative UX + LLM Evaluation"
  title: "Fetal Sex Disclosure &amp; AI Harm Cascades"
  type: publication
  desc: "Where revealing a baby's sex can lead to gender-related harm, what happens when people ask a chatbot? We interviewed 13 OB/GYNs and radiologists to set clinical norms, built a four-pathway harm framework and clinical reference standard, and used them to audit models from OpenAI, Anthropic and Google in English and Roman Urdu across single-turn, 6-turn and 18-turn adversarial conversations. Longer conversations surfaced failures single-turn tests miss, including hallucinated disclosure and over-refusal. As first author and project lead, I ran the interviews and analysis and designed and built the Python evaluation pipeline, with a 3-judge LLM panel and human adjudication. Supported by the Gates Foundation and Google."
  links:
    - label: "View Publication"
      pending: true
      suffix: "· soon"

- meta: "ACM CHI 2027 · Under Revision · Health AI · Qualitative HCI"
  title: "After Dismissal"
  type: publication
  desc: "What happens when women whose concerns are dismissed by a clinician turn to generative AI? Through 26 interviews with women in Pakistan, the paper traces how they used GenAI to build a second account of an unresolved health problem, weighed it against other information and their own bodily knowledge, and decided whether to bring it back to clinicians or act outside formal care. It introduces <em>compensatory reallocation</em>: healthcare work left unresolved by dismissal moves elsewhere without a matching transfer of authority. I supervised the undergraduate research team and rewrote and reframed the paper, now under revision for CHI 2027."
  links:
    - label: "View Publication"
      pending: true
      suffix: "· under revision"

- meta: "Health AI Evaluation · Teaching Tool · Interactive Web App"
  title: "DDH Evaluation Clinic"
  type: design
  desc: "An interactive classroom tool for the Evaluation Clinic session, co-led with Ayesha Mirza (Awaaz-e-Sehat Researchers). Students plan how to evaluate a health AI tool through five exercises that build on each other: FITT individuals, tasks and technology; ISO 9241-11 definitions in context; dragging each relationship onto Reinmund's care-pathway stages and challenges; choosing tests and go/no-go gates; and drafting an evidence statement. Answers save on the device as they're typed and export as a PDF or spreadsheet."
  links:
    - label: "Open the Clinic"
      url: "/DDH/"
      primary: true

- meta: "Maternal Health · UX Design · Interactive Prototype"
  title: "TBA Helper"
  type: design
  desc: "A low-literacy maternal-health prototype for Traditional Birth Attendants (TBAs), led in collaboration with Aga Khan University and VITAL Pakistan. Synthesized official TBA curricula, WHO guidance, and focus-group findings from frontline TBAs into the prototype's information architecture, content structure, and interaction flows, iteratively refined around information overload, literacy constraints, usability, and referral needs in Pakistan."
  links:
