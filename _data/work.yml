  desc: "The smaller design work woven into a bigger research role: redesigning the electronic medical record intake and the AI-generated clinical summary for faster provider review, and designing patient-facing recruitment materials — clinic handout cards, Facebook ads — iterating messaging, visual hierarchy, and accessibility for low-literacy audiences."
