# ============================================================
# WORK PROJECTS — data source for /work/
# Each entry renders one .work-card on the Work page, in order.
# To add/reorder/edit a project: edit THIS file, not work/index.html.
#
# Fields per entry:
#   meta        (required) the small label line above the title
#   title       (required) project name
#   desc        (required) one-paragraph description
#   type        (required) "publication" or "prototype" — powers the
#               All / Publications / Prototypes filter on /work/.
#
#   Then EITHER a list of links OR a status string (not both):
#
#   links:      list of buttons. Each link has:
#               - label   (required) text shown
#                 url     (for real links) destination. Use a site path like
#                         "/work/beyond-euphemisms/" for internal pages (passed
#                         through relative_url), or a full https:// URL.
#                 external  (optional) true -> opens in new tab w/ rel=noopener
#                 muted     (optional) true -> adds work-card__link--muted
#                 primary   (optional) true -> adds work-card__link--primary
#                           (accent-outlined, fills solid on hover). Use for
#                           the lead CTA, e.g. "View Publication".
#                 suffix    (optional) faint appended text, e.g. "· soon"
#                 pending   (optional) true -> renders an INERT button (a <span>,
#                           not a link): same pill look, but goes nowhere and is
#                           not clickable. Use for "View Case Study · soon". When
#                           pending is true, `url`/`external`/`primary` are ignored.
#
#   status:     a plain string -> renders one .work-card__status span instead
#               of any link buttons. Use for projects with nothing to link yet.
# ============================================================

- meta: "ACM CHI 2026 · Health AI · Qualitative UX + LLM Evaluation"
  title: "Beyond Euphemisms"
  type: publication
  desc: "A study of how LLMs interpret culturally specific, indirect, and euphemistic language used to discuss sexual, reproductive, and maternal health in Pakistan. Combining field observations, interviews, focus groups, and systematic evaluation of five LLMs, we developed a Domain–Approach framework for characterizing indirect communication and identified failure modes that conventional aggregate model-performance measures can obscure."
  links:
    - label: "View Publication"
      url: "https://doi.org/10.1145/3772318.3791315"
      external: true
      primary: true

- meta: "USENIX SOUPS 2026 · Privacy &amp; Security · Qualitative UX"
  title: "Sharing Digital Devices Is Normal and Cultural"
  type: publication
  desc: "An examination of how privacy and security are negotiated when digital devices are routinely shared within South Asian immigrant families. Through qualitative research with 18 families, we studied how social expectations around helping, access, and family responsibility shape privacy risks, and developed frameworks translating participants' everyday sharing practices and feature requests into broader needs around autonomy, access control, and multi-user device design."
  links:
    - label: "View Publication"
      url: "https://www.usenix.org/conference/soups2026/presentation/shanza"
      external: true
      primary: true

- meta: "Nature Health · Health AI · Qualitative UX + LLM Evaluation"
  title: "Fetal Sex Disclosure &amp; AI Harm Cascades"
  type: publication
  desc: "An investigation into how conversational AI can create safety risks when responding to requests for fetal sex information in contexts where disclosure may carry downstream gender-related harms. Drawing on interviews with OB/GYNs and radiologists, we developed a clinically grounded harm framework and used it to design a multi-turn adversarial evaluation of leading LLMs, testing how safety behavior changes under sustained conversational pressure and across language conditions."
  links:
    - label: "View Publication"
      pending: true
      suffix: "· soon"

- meta: "Maternal Health · UX Design · Interactive Prototype"
  title: "TBA Maternal-Health Prototype"
  type: prototype
  desc: "A low-literacy maternal-health prototype for Traditional Birth Attendants (TBAs), led in collaboration with Aga Khan University and VITAL Pakistan. Synthesized official TBA curricula, WHO guidance, and focus-group findings from frontline TBAs into the prototype's information architecture, content structure, and interaction flows, iteratively refined around information overload, literacy constraints, usability, and referral needs in Pakistan."
  links:
    - label: "View Prototype"
      url: "/prototypes/tba-maternal-health/"
      external: true
      pending: true
      suffix: "· soon"

- meta: "Accessibility · UX Design · Interactive Prototype"
  title: "Rehnuma"
  type: prototype
  desc: "An accessibility rating platform for public spaces, grounded in the lived experiences of people with disabilities. Built on 20+ interviews and a collaboration with PSRD."
  links:
    - label: "View Prototype"
      url: "/prototypes/rehnuma/"
      external: true
      pending: true
      suffix: "· soon"
