<head>
  <!-- Applied before any CSS loads, so the theme choice and the
       explosions on/off state are both in place for first paint instead
       of flashing the default and then correcting a moment later once
       main.js runs (deferred, so it only executes after the DOM — and
       this button — exist). Mirrors the toggle logic in assets/js/main.js
       (dark -> rose -> garnet -> crimson) — keep the two in sync. Light
       is pulled from the rotation for now (tokens.css still has it, just
       nothing sets it anymore) — rose is this site's light theme these
       days, so a first-time visitor with no stored choice who prefers a
       light OS lands on rose instead of dark; a stale stored "light"
       from before falls into that same OS-preference check rather than
       straight to dark. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var theme;
        if (stored === "rose" || stored === "dark" || stored === "garnet" || stored === "crimson") {
          theme = stored;
        } else {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "rose" : "dark";
        }
        if (theme !== "dark") document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
      try {
        if (localStorage.getItem("debrisEnabled") === "off") document.documentElement.setAttribute("data-debris", "off");
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="{{ page.og_type | default: 'website' }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Sacramento&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
