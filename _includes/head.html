<head>
  <!-- Applied before any CSS loads, so the dark/rose choice and the
       explosions on/off state are both in place for first paint instead
       of flashing the default and then correcting a moment later once
       main.js runs (deferred, so it only executes after the DOM — and
       this button — exist). Mirrors the toggle logic in assets/js/main.js
       — keep the two in sync. Light is pulled from the rotation for
       now (tokens.css still has it, just nothing sets it anymore) —
       a stale stored "light" from before falls through to dark here,
       same as main.js's own fallback. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem("theme") === "rose") document.documentElement.setAttribute("data-theme", "rose");
      } catch (e) {}
      try {
        if (localStorage.getItem("debrisEnabled") === "off") document.documentElement.setAttribute("data-debris", "off");
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="{{ page.og_type | default: 'website' }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Sacramento&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
