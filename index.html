<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DDH Evaluation Clinic</title>
  <meta name="description" content="DDH Evaluation Clinic">
  <style>
    :root {
      --bg: #fdf1f4;
      --text: #2b1f22;
      --accent: #8c1f2b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0e10;
        --text: #f5f6f7;
        --accent: #f2e3a0;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>DDH Evaluation Clinic</h1>
  </main>
</body>
</html>
